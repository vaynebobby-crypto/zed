name: build_release
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
on:
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.231.0)'
        required: true
        type: string
jobs:
  bundle_linux_x86_64:
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: 0
      CC: clang
      CXX: clang++
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        clean: false
    - name: setup_node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: setup_linux
      run: ./script/linux
    - name: download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: bundle_linux
      run: ./script/bundle-linux
    - name: upload_zed_linux_x86_64
      uses: actions/upload-artifact@v4
      with:
        name: zed-linux-x86_64.tar.gz
        path: target/release/zed-linux-x86_64.tar.gz
        if-no-files-found: error
    - name: upload_remote_server_linux_x86_64
      uses: actions/upload-artifact@v4
      with:
        name: zed-remote-server-linux-x86_64.gz
        path: target/zed-remote-server-linux-x86_64.gz
        if-no-files-found: error
    timeout-minutes: 120
  bundle_mac_aarch64:
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: 0
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        clean: false
    - name: setup_node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: bundle_mac_aarch64
      run: ./script/bundle-mac aarch64-apple-darwin
    - name: upload_zed_aarch64_dmg
      uses: actions/upload-artifact@v4
      with:
        name: Zed-aarch64.dmg
        path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
        if-no-files-found: error
    - name: upload_remote_server_macos_aarch64
      uses: actions/upload-artifact@v4
      with:
        name: zed-remote-server-macos-aarch64.gz
        path: target/zed-remote-server-macos-aarch64.gz
        if-no-files-found: error
    timeout-minutes: 120
  bundle_mac_x86_64:
    runs-on: macos-13
    env:
      CARGO_INCREMENTAL: 0
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        clean: false
    - name: setup_node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: bundle_mac_x86_64
      run: ./script/bundle-mac x86_64-apple-darwin
    - name: upload_zed_x86_64_dmg
      uses: actions/upload-artifact@v4
      with:
        name: Zed-x86_64.dmg
        path: target/x86_64-apple-darwin/release/Zed-x86_64.dmg
        if-no-files-found: error
    - name: upload_remote_server_macos_x86_64
      uses: actions/upload-artifact@v4
      with:
        name: zed-remote-server-macos-x86_64.gz
        path: target/zed-remote-server-macos-x86_64.gz
        if-no-files-found: error
    timeout-minutes: 120
  create_release:
    needs:
    - bundle_linux_x86_64
    - bundle_mac_aarch64
    - bundle_mac_x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: download_artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts/
    - name: prepare_artifacts
      run: |
        mkdir -p release-artifacts/
        mv ./artifacts/Zed-aarch64.dmg/Zed-aarch64.dmg release-artifacts/Zed-aarch64.dmg
        mv ./artifacts/Zed-x86_64.dmg/Zed-x86_64.dmg release-artifacts/Zed-x86_64.dmg
        mv ./artifacts/zed-linux-x86_64.tar.gz/zed-linux-x86_64.tar.gz release-artifacts/zed-linux-x86_64.tar.gz
        mv ./artifacts/zed-remote-server-macos-aarch64.gz/zed-remote-server-macos-aarch64.gz release-artifacts/zed-remote-server-macos-aarch64.gz
        mv ./artifacts/zed-remote-server-macos-x86_64.gz/zed-remote-server-macos-x86_64.gz release-artifacts/zed-remote-server-macos-x86_64.gz
        mv ./artifacts/zed-remote-server-linux-x86_64.gz/zed-remote-server-linux-x86_64.gz release-artifacts/zed-remote-server-linux-x86_64.gz
    - name: create_github_release
      run: |
        TAG="${{ github.ref_name }}"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.tag }}"
        fi
        gh release create "$TAG" release-artifacts/* \
          --title "$TAG" \
          --draft \
          --generate-notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
